[sqlserver]
# Para SQL Server Express instalado localmente:
server = DESKTOP-I9EEE8A

# Si tu instancia se llama diferente, cambia SOLO la línea anterior.
# Ejemplos:
# server = localhost
# server = DESKTOP-ABC123\SQLEXPRESS

database = PragmaDataChallenge

# Autenticación de Windows (recomendada para una instalación local)
trusted_connection = yes

# Solo se usan si trusted_connection = no
username = sa
password = CambiarEstaClave

# El programa intentará usar este driver; si no existe, busca 18, 17 o "SQL Server".
driver = ODBC Driver 18 for SQL Server
trust_server_certificate = yes

[pipeline]
# Número máximo de filas que se mantienen en memoria por micro-batch.
# Para esta prueba usamos 1 fila por micro-batch, de modo que las estadísticas
# se actualicen después de cada fila insertada, tal como sugiere idealmente el enunciado.
chunk_size = 1
